version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directory: "/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bundler"
    directory: "/desktop"
    schedule:
      interval: "weekly"
