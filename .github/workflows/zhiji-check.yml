name: zhiji-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COCOAPODS_VERSION: '1.16.2'
  BUNDLE_GEMFILE: ${{ github.workspace }}/desktop/Gemfile
  BUNDLE_FROZEN: 'true'

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1.6'
          bundler: '2.4.22'
          bundler-cache: true
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend
      - name: Install desktop dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: desktop
      - name: Verify frozen Ruby dependencies
        run: bundle check
        working-directory: desktop
      - name: Verify locked macOS pods
        run: bundle exec ruby -e 'require "logger"; load Gem.bin_path("cocoapods", "pod")' -- install --deployment
        working-directory: desktop/macos
      - name: Install media dependencies
        run: brew install ffmpeg
      - name: Install backend test dependencies
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Run unified check
        env:
          ZHIJI_EXPLICIT_ANY_BASE_REF: ${{ github.event.pull_request.base.sha }}
          ZHIJI_STRUCTURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ZHIJI_SKIP_RELEASE_CHECK=1 ./scripts/check.sh
      - name: Analyze Flutter desktop shell
        run: flutter analyze
        working-directory: desktop
      - name: Run backend tests
        run: PYTHONPATH=src uv run --frozen python -m pytest -q

  supply-chain:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.31'
          enable-cache: true
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Verify frozen Python dependencies
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Install locked desktop dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: desktop
      - name: Install verified supply-chain tools
        run: ./scripts/install_supply_chain_tools.sh "$RUNNER_TEMP/zhiji-tools"
      - name: Generate and validate source and dependency SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
          SYFT_CACHE_DIR: ${{ runner.temp }}/syft-cache
        run: |
          "$RUNNER_TEMP/zhiji-tools/syft" scan dir:. \
            --exclude './.git/**' \
            --exclude './.venv/**' \
            --exclude './app/frontend/node_modules/**' \
            --exclude './desktop/.dart_tool/**' \
            --exclude './data/**' \
            --exclude './outputs/**' \
            --output "cyclonedx-json=$RUNNER_TEMP/source-sbom.cdx.json"
          uv run --frozen python scripts/generate_lock_sbom.py \
            "$RUNNER_TEMP/locked-dependencies-sbom.cdx.json"
          uv run --frozen python scripts/validate_sbom.py \
            "$RUNNER_TEMP/source-sbom.cdx.json" \
            "$RUNNER_TEMP/locked-dependencies-sbom.cdx.json" \
            --require-lock-root .
      - name: Scan locked dependencies
        run: |
          set +e
          "$RUNNER_TEMP/zhiji-tools/osv-scanner" scan source \
            --format json \
            --output-file "$RUNNER_TEMP/osv-report.json" \
            --lockfile uv.lock \
            --lockfile app/frontend/package-lock.json \
            --lockfile desktop/pubspec.lock \
            --sbom "$RUNNER_TEMP/source-sbom.cdx.json" \
            --sbom "$RUNNER_TEMP/locked-dependencies-sbom.cdx.json"
          scanner_status=$?
          set -e
          if [[ "$scanner_status" -gt 1 ]]; then
            echo "OSV Scanner failed with status $scanner_status" >&2
            exit "$scanner_status"
          fi
          uv run --frozen python scripts/vulnerability_gate.py \
            "$RUNNER_TEMP/osv-report.json" \
            .github/security/vulnerability-exceptions.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-and-lock-cyclonedx-sboms
          path: |
            ${{ runner.temp }}/source-sbom.cdx.json
            ${{ runner.temp }}/locked-dependencies-sbom.cdx.json
          if-no-files-found: error
