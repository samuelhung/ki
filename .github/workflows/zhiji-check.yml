name: zhiji-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend
      - name: Install backend test dependencies
        run: python -m pip install -e . pytest httpx
      - name: Run unified check
        run: ZHIJI_SKIP_RELEASE_CHECK=1 ./scripts/check.sh
      - name: Run backend smoke tests
        run: PYTHONPATH=src python -m pytest tests/test_backend_smoke.py tests/test_collect_api.py tests/test_digest_api.py tests/test_ingest_api.py tests/test_rss_collector.py tests/test_source_registry.py -q
