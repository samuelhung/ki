name: cocoapods-outdated

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_GEMFILE: ${{ github.workspace }}/desktop/Gemfile
  BUNDLE_FROZEN: 'true'
  LANG: en_US.UTF-8

jobs:
  audit:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.1.6'
          bundler: '2.4.22'
          bundler-cache: true
      - name: Install locked desktop dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: desktop
      - name: Verify frozen CocoaPods CLI dependencies
        run: bundle check
        working-directory: desktop
      - name: Check for CocoaPods updates
        run: |
          set +e
          bundle exec ruby -e 'require "logger"; load Gem.bin_path("cocoapods", "pod")' -- \
            outdated --repo-update --no-ansi | tee "$RUNNER_TEMP/cocoapods-outdated.txt"
          pod_status=${PIPESTATUS[0]}
          set -e
          if [[ "$pod_status" -ne 0 ]]; then
            echo "CocoaPods outdated audit failed with status $pod_status" >&2
            exit "$pod_status"
          fi
          if grep -Fq "The following pod updates are available:" "$RUNNER_TEMP/cocoapods-outdated.txt"; then
            echo "Locked CocoaPods dependencies have updates available" >&2
            exit 1
          fi
        working-directory: desktop/macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cocoapods-outdated-report
          path: ${{ runner.temp }}/cocoapods-outdated.txt
          if-no-files-found: error
