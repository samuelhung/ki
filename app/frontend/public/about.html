<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(135deg, #0B0C10 0%, #12161C 100%);
  display:flex; align-items:center; justify-content:center;
  height:100vh; font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  user-select:none; -webkit-user-select:none;
}
.container { text-align:center; padding:32px; }
.logo {
  width:72px; height:72px; background:linear-gradient(135deg,#6366f1,#38bdf8);
  border-radius:18px; display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px; font-size:28px; font-weight:700; color:#fff;
  box-shadow:0 6px 24px rgba(99,102,241,0.25);
}
.name { font-size:20px; font-weight:600; color:#e2e8f0; margin-bottom:6px; }
.subtitle { font-size:12px; color:#64748b; margin-bottom:20px; line-height:1.6; }
.version { font-size:13px; color:#8b5cf6; margin-bottom:24px; }
.info { font-size:11px; color:#475569; line-height:1.8; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">知</div>
  <div class="name">知几</div>
  <div class="subtitle">知几其神乎<br/>见微知著</div>
  <div class="version" id="version">v1.3.2</div>
  <div class="info">
    © 2026<br/>
    samuelhung
  </div>
</div>
</body>
</html>
