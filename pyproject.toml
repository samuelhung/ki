[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiji-backend"
version = "2.0.0"
description = "知几 —— 个人情报中心后端服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.14",
    "openai>=2.50.0",
    "yt-dlp>=2024",
    "tos>=2.9",
    "trafilatura>=1.6",
    "pyyaml>=6.0",
    "aiofiles>=23.2",
    "pydantic>=2.5",
]

[project.optional-dependencies]
volc = []
all = ["zhiji-backend[volc]"]

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "httpx>=0.28,<1",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.0,<1",
    "setuptools>=83.0.0,<84",
    "wheel>=0.46,<1",
]

[project.scripts]
zhiji = "zhiji_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/backfill_overviews.py" = ["E402"]
"tests/*.py" = ["E402"]
