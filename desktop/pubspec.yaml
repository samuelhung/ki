name: zhiji_desktop
description: "知几 — 知识情报中心桌面端"
publish_to: 'none'
version: 1.0.23+24

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # 路由
  go_router: ^14.8.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # 网络
  dio: ^5.7.0
  # 窗口管理 (macOS)
  window_manager: ^0.4.3
  # Markdown 渲染
  flutter_markdown: ^0.7.6
  # JSON 序列化
  json_annotation: ^4.9.0
  # 工具
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
