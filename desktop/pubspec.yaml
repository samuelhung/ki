name: zhiji_desktop
description: "知几 — 知识情报中心桌面端 (WebView 壳)"
publish_to: 'none'
version: 2.0.0+90

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # WebView
  webview_flutter: ^4.10.0
  # 托盘最小化
  tray_manager: ^0.5.3
  # 窗口管理 (macOS)
  window_manager: ^0.5.2
  # 打开外部链接 (JS Bridge 用)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - changelog.json
